name: Deploy RDCD Navigator to Connect Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install rsconnect
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: rsconnect

      - name: Deploy to existing Connect Cloud app
        env:
          CONNECT_CLOUD_CLIENT_ID: ${{ secrets.CONNECT_CLOUD_CLIENT_ID }}
          CONNECT_CLOUD_CLIENT_SECRET: ${{ secrets.CONNECT_CLOUD_CLIENT_SECRET }}
        run: |
          Rscript -e '
            rsconnect::connectCloudClientCredentials(
              clientId = Sys.getenv("CONNECT_CLOUD_CLIENT_ID"),
              clientSecret = Sys.getenv("CONNECT_CLOUD_CLIENT_SECRET"),
              account = "splwman"
            )

            rsconnect::deployDoc(
              doc = "RDCD_Data_Source_Navigator_Shiny_App_main.Rmd",
              appId = "01a0e8aa-1f0a-74ef-6426-99ba8508d9a8",
              launch.browser = FALSE
            )
          '
