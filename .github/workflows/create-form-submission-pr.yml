name: Create review pull request from form submission

on:
  repository_dispatch:
    types: [form_submission]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-review-pr:
    runs-on: ubuntu-latest
    env:
      SUBMISSION_JSON: ${{ toJSON(github.event.client_payload) }}
      RECORD_ID: ${{ github.event.client_payload.record_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the current public data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Add the submitted record to a review branch
        run: |
          python scripts/add_form_submission.py

          branch="form-submission-${RECORD_ID}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RDCD_Data_Source_Preparation_Template.xlsx
          git commit -m "Stage ${RECORD_ID} for review"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Review ${RECORD_ID} data-source submission" \
            --body-file /tmp/form_submission_review.md
